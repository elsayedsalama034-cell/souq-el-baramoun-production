<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#118f92"><title>سوق البرامون - معاينة</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f5f5;color:#173d40;font-family:Tahoma,Arial,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 30px #0001}.top{padding:21px 16px 17px;background:linear-gradient(135deg,#53d5d4,#118f92);color:#fff;border-radius:0 0 25px 25px}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:24px}.brand small{display:block;margin-top:4px;opacity:.9}.logo{font-size:31px}.search{margin-top:16px;background:#fff;border-radius:15px;padding:11px 12px;display:flex;gap:8px;align-items:center;color:#587}.search input{width:100%;border:0;outline:0;font-size:15px}.chips{display:flex;gap:8px;overflow:auto;padding:14px 13px 10px}.chip{border:1px solid #d9e9e9;background:white;border-radius:22px;padding:8px 13px;white-space:nowrap}.chip.on{background:#dff8f7;border-color:#45c8c6;color:#118f92}.wrap{padding:0 14px 90px}.notice{background:#fff8dc;border:1px solid #f1df9b;border-radius:14px;padding:10px 12px;font-size:11px;margin:5px 0 12px}.hero{height:220px;border-radius:22px;position:relative;overflow:hidden;background:#183f42;direction:ltr}.hero img{width:100%;height:100%;object-fit:cover;display:block}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#0002,transparent 35%,#000a)}.badge{position:absolute;right:13px;top:13px;background:#f5ad2e;color:white;border-radius:20px;padding:7px 10px;font-size:12px;direction:rtl}.heroText{position:absolute;right:17px;bottom:27px;color:white;direction:rtl}.heroText b{display:block;font-size:20px}.heroText span{font-size:13px}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#fff9;font-size:24px;z-index:3}.arrow.r{right:10px}.arrow.l{left:10px}.dots{position:absolute;bottom:9px;left:0;right:0;text-align:center;color:#fff}.section{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 11px}.section h2{margin:0;font-size:18px}.section span{font-size:12px;color:#118f92}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{border:1px solid #e1eeee;border-radius:17px;overflow:hidden;background:#fff}.pic{height:125px;background:#edfafa;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}.card div:last-child{padding:10px}.card b{display:block;font-size:13px;margin-bottom:6px}.card .category{display:flex;align-items:center;gap:5px;width:max-content;max-width:100%;padding:5px 8px;margin-bottom:6px;border-radius:10px;background:#eef8f0;border:1px solid #d9eedc;color:#287b43;font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .category small{font-size:9px;color:#6d8c76;font-weight:700}.price{display:block;color:#118f92;font-weight:bold;margin-top:7px}.muted{font-size:10px;color:#789;margin:6px 0 0}.empty{padding:22px;text-align:center;color:#718;grid-column:1/-1}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:white;border-top:1px solid #e4eeee;display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottom span{font-size:11px;color:#647b7d;text-align:center}.plus{width:53px;height:53px;border-radius:50%;background:#118f92;color:#fff!important;display:grid;place-items:center;font-size:30px!important;border:5px solid #fff;margin-top:-27px}.direction{direction:rtl}@media(max-width:360px){.brand b{font-size:21px}.hero{height:200px}}
</style></head><body><div class="phone"><header class="top"><div class="brand"><div><b>سوق البرامون</b><small>سوق بلدنا لكل حاجة</small></div><div class="logo">🛍️</div></div><div class="search">🔎<input id="q" placeholder="ابحث عن منتج أو خدمة..."></div></header><div class="chips" id="chips"></div><main class="wrap"><div class="notice">وضع المعاينة: بيانات وصور تجريبية جاهزة لكل الفئات. يمكنك حذفها لاحقاً من النسخة الحقيقية.</div><section class="hero" id="hero"></section><div class="section"><h2>أحدث الإعلانات</h2><span>بيانات تجريبية</span></div><div class="grid" id="grid"></div><div class="section"><h2>الأكثر مشاهدة</h2><span>بيانات تجريبية</span></div><div class="grid" id="popular"></div></main><nav class="bottom"><span>⌂<br>الرئيسية</span><span>▦<br>الفئات</span><span class="plus">+</span><span>♡<br>المفضلة</span><span>♙<br>حسابي</span></nav></div><script>
const C=[['all','✨','الكل'],['cars','🚗','سيارات'],['mobiles','📱','موبايلات'],['realestate','🏠','عقارات'],['furniture','🛋️','أثاث'],['electronics','💻','إلكترونيات'],['services','🛠️','خدمات'],['jobs','💼','وظائف']];
const A=[
['cars','أول أستر 2021 ديجيتو 4 فلول','480,000 ج.م','البرامون','https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=900&q=80',1220],
['cars','تويوتا أوري 2020','165,000 ج.م','المنصورة','https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=80',615],
['mobiles','موبايل سامسونج A54 256 جيجا','13,500 ج.م','أجا','https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=80',910],
['mobiles','آيفون 13 بحالة ممتازة','25,000 ج.م','البرامون','https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=900&q=80',740],
['realestate','شقة 140 متر أول البرامون','950,000 ج.م','البرامون','https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80',1450],
['realestate','قطعة أرض للبيع على طريق رئيسي','1,250,000 ج.م','المنصورة','https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=900&q=80',510],
['furniture','كنبة مودرن خام طبيعي','1,900 ج.م','البرامون','https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80',380],
['furniture','غرفة نوم كاملة مودرن','18,500 ج.م','أجا','https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=900&q=80',680],

['electronics','شاشة سمارت 55 بوصة','19,900 ج.م','المنصورة','https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=900&q=80',420],
['services','خدمة تنظيف منازل احترافية','من 250 ج.م','البرامون','https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=900&q=80',842],
['services','حلاق رجالي وحجز بالمواعيد','100 ج.م','البرامون','https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=900&q=80',330],
['jobs','مطلوب موظف مبيعات','راتب مجزي','البرامون','https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=900&q=80',560],
['jobs','فرصة عمل لمحاسب','حسب الخبرة','المنصورة','https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=900&q=80',390]
];
let cat='all',q='',slide=0;const featured=A.filter((_,i)=>[0,2,4,7,8,10,12].includes(i));
const chips=document.getElementById('chips');chips.innerHTML=C.map(x=>`<button class="chip ${x[0]==='all'?'on':''}" data-c="${x[0]}">${x[1]} ${x[2]}</button>`).join('');
const catMap=Object.fromEntries(C.map(x=>[x[0],x]));function render(){const list=A.filter(a=>(cat==='all'||a[0]===cat)&&(!q||a[1].includes(q)||a[3].includes(q)));const card=a=>{const c=catMap[a[0]]||['other','🏷️','أخرى'];return `<article class="card"><div class="pic"><img src="${a[4]}" alt="${a[1]}"></div><div><b>${a[1]}</b><div class="category"><span>${c[1]}</span><span>${c[2]}</span></div><span class="price">${a[2]}</span><p class="muted">📍 ${a[3]} · 👁 ${a[5]}</p></div></article>`};document.getElementById('grid').innerHTML=list.slice(0,8).map(card).join('')||'<div class="empty">لا توجد نتائج مطابقة.</div>';document.getElementById('popular').innerHTML=[...list].sort((a,b)=>b[5]-a[5]).slice(0,4).map(card).join('')||'<div class="empty">لا توجد نتائج مطابقة.</div>';renderHero();}
function renderHero(){const a=featured[slide%featured.length];document.getElementById('hero').innerHTML=`<img src="${a[4]}" alt="${a[1]}"><div class="shade"></div><span class="badge">⭐ إعلان مميز</span><div class="heroText"><b>${a[1]}</b><span>${a[2]} · ${a[3]}</span></div><button class="arrow r" onclick="next(-1)">›</button><button class="arrow l" onclick="next(1)">‹</button><div class="dots">${featured.map((_,i)=>i===slide%featured.length?'●':'○').join(' ')}</div>`}
window.next=d=>{slide=(slide+d+featured.length)%featured.length;renderHero()};chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()});document.getElementById('q').oninput=e=>{q=e.target.value.trim();render()};render();setInterval(()=>next(-1),5000);
</script></body></html>
