name: فك ضغط المشروع

on:
  push:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: فك الضغط
        run: |
          if [ -f "souq-el-baramoun-production-v34.zip" ]; then
            unzip -o "souq-el-baramoun-production-v34.zip" -d extracted
            cp -r extracted/* .
            rm -rf extracted
            rm -f "souq-el-baramoun-production-v34.zip"
          else
            echo "لا يوجد ملف ZIP"
          fi

      - name: حفظ الملفات
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "فك ضغط المشروع" || true
          git push
