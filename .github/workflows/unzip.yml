name: فك ضغط المشروع

on:
  workflow_dispatch:
  push:
    paths:
      - "souq-el-baramoun-production-v34.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: فك الضغط
        run: |
          mkdir -p project
          unzip -o "souq-el-baramoun-production-v34.zip" -d project

      - name: رفع الملفات للمستودع
        run: |
          cp -r project/* .
          rm -rf project
          rm -f "souq-el-baramoun-production-v34.zip"

      - name: حفظ التغييرات
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "فك ضغط المشروع ورفع الملفات" || exit 0
          git push
